<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Engineer Notes</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#003f2d">
<style>
:root{--red:#c8102e;--navy:#003f2d;--accent:#17e88f;--bg:#f2f4f8;--card:#fff;--line:#d9dee7}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:#1b2330}
header{border-bottom:4px solid var(--accent);background:var(--navy);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:20px;cursor:pointer}
header small{opacity:.7;flex:1}
button,select,input,textarea{font:inherit}
.btn{background:var(--navy);color:#fff;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;font-weight:600}
.btn.alt{background:#fff;color:var(--navy);border:1px solid var(--line)}
.btn:disabled{opacity:.5}
#banner{background:#fff3cd;color:#664d03;padding:10px 16px;font-size:14px}
#banner.err{background:#f8d7da;color:#58151c}
main{max-width:900px;margin:0 auto;padding:16px}
h2{font-size:14px;text-transform:uppercase;letter-spacing:.06em;color:#5b6677;margin:22px 0 8px}
.sub{font-size:15px;margin:18px 0 8px;padding-left:8px;border-left:4px solid var(--accent);color:#1b2330}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.area{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--navy);border-radius:10px;padding:14px;text-align:left;cursor:pointer;min-height:72px}
.area.hasopen{border-left-color:var(--red)}
.area.folder{border-left-color:var(--accent);background:#f4fbf8}
.area b{display:block;margin-bottom:6px}
.pill{display:inline-block;font-size:12px;border-radius:99px;padding:2px 8px;background:#e7ebf2;margin-right:4px}
.pill.open{background:var(--red);color:#fff}
.pill.prog{background:#f0ad00;color:#000}
.pill.el{background:#ffe08a;color:#000}
.pill.hv{background:#9fd8ff;color:#000}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
label{display:block;font-size:13px;font-weight:600;margin:10px 0 4px}
input[type=text],select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:#fff}
select#loc{border:2px solid var(--accent);font-weight:600}
.locbox{background:#f4fbf8;border:1px solid var(--accent);border-radius:10px;padding:4px 12px 12px;margin-bottom:6px}
.hint{font-size:12px;color:#5b6677;margin-top:6px}
textarea{min-height:110px;resize:vertical}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>div{flex:1;min-width:140px}
.thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.thumbs img{height:90px;border-radius:8px;border:1px solid var(--line);cursor:pointer}
.thumbs .x{position:relative}
.thumbs .x button{position:absolute;top:2px;right:2px;border:0;background:#000a;color:#fff;border-radius:50%;width:24px;height:24px}
.note .meta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:13px;color:#5b6677;margin-bottom:6px}
.note .txt{white-space:pre-wrap;word-wrap:break-word}
.note .sent{font-size:13px;color:#5b6677;margin-top:8px}
.note .acts{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
.note .acts select{width:auto}
.del{background:none;border:0;color:#a00;cursor:pointer;margin-left:auto}
#lb{position:fixed;inset:0;background:#000d;display:none;align-items:center;justify-content:center;z-index:20}
#lb img{max-width:96vw;max-height:94vh}
.empty{color:#667;text-align:center;padding:24px}
.picks{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:2px 12px;margin-top:4px}
.picks label{display:flex;align-items:center;gap:10px;font-weight:400;font-size:15px;margin:0;padding:9px 2px}
.picks input{width:22px;height:22px}
details.em{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff}
details.em summary{cursor:pointer;font-weight:600}
</style>
</head>
<body>
<header>
  <h1 onclick="location.hash=''">Engineer Notes</h1>
  <small>Butlins Skegness</small>
  <button class="btn alt" id="refresh">↻</button>
</header>
<div id="banner" hidden></div>
<main id="app"></main>
<div id="lb" onclick="this.style.display='none'"><img id="lbimg" alt=""></div>

<script>
/* ===== SETTINGS ===== */
// PASTE YOUR GOOGLE APPS SCRIPT WEB APP URL BETWEEN THE QUOTES:
const API_URL = 'https://script.google.com/macros/s/AKfycbyhhMtVDAV9j_4xnV2rRTDxw8fhtl4WbpRb66ERAyPhoVkzJQYfnJyJ15MU3F0ZgMo/exec';

// Names only (email addresses are kept safely in the Apps Script).
const USERS = ['Len Allen',"Aaran O'Donnell",'Rik Wolstenholme','Daniel Wynn','Ken McDowell','Billy Gibbs','Ben Mills'];
const TRADES = ['Electrical','HVAC'];

// Areas in this section get a "Location" list box; the note is saved to the chosen location too.
const COPY_GROUP = 'Substations / Plantrooms';

// An area is a plain name, or {name, kids:[...]} which opens a second screen.
// Add bld:true to a folder to show a Building 1 / Building 2 choice on its areas.
const AREAS = [
    {g:'Skyline', n:['Skyline','Hotshots','Centre Stage','Costa Coffee','Toy Box','Butlins Store','Jellyfish','Yacht Club','The Deck','Supermarket A','Toilets','Mega Treats','Funworks (Skyline)','Ents Building First Floor']},
  {g:'Venues', n:['Reds','New Arcade','Supermarket B','Skypark','Discovery Studio','Pottery Studio','Soft Play','Green Baize','Fairground','Football Pitches','Laser Tag','Nursery','Studio 36','Splash','Pig and Whistle']},
  {g:'Restaurants', n:['Coral - Coast','Beachcomber','Skypark Cafe','Chopstix',"Papa John's","Papa John's Food Truck",'Smirnoff Bar','The Diner']},
  {g:'Admin / Other', n:['Facilities','Admin','Team B','B-Hive','Accommodation Stores','Caravan Sales','Caravan Reception','Caravan Maintenance','Gold Cleaners','Fairground Cleaners','Security Gate','Caravan Security Gate','North Check-in','South Check-in']},
  {g:'Caravan Village', n:['Dunes','Paddocks','The Retreat','Sands','Bankside','Maple Walk']},
  {g:'Accommodation', n:[
    'Pacific Wharf','Fairground Apartments',
    {name:'The Keys', bld:true, kids:['Sands Court','Neptune Court','Waves Court','Gull Court','Mermaid Court','Reef Court','Keel Court','Easterly Court']},
    {name:'Lagoon Bay', kids:['Seaside Apartments','Cuttlefish Walk','Minnows Way','Pebblestone Place']},
    {name:'Ocean Point', kids:['Shell Close','Headland Drive','Fishermans Cove','Atlantic Avenue']},
    {name:'Starfish Quay', kids:['Barracuda Villa','Angelfish Court','Lobster Court','Seahorse Court','Pelican Court','Turtle Court','Dolphin Court']}
  ]},
  {g:'Substations / Plantrooms', n:['Plantrooms'], sub:[
    {g:'Substations', n:'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').map(l=>'Substation '+l)}
  ]}
];
const STATUSES = ['Open','In progress','Resolved'];
/* ==================== */

const $ = s => document.querySelector(s);
const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = ts => { const d=new Date(ts); return d.toLocaleDateString('en-GB')+' '+d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}); };
const ALL = AREAS.flatMap(g=>[
  ...g.n.flatMap(x=> typeof x==='string'
    ? [{id:slug(x),name:x,group:g.g}]
    : x.kids.map(k=>({id:slug(k),name:k,group:g.g+' › '+x.name,parent:x}))),
  ...(g.sub||[]).flatMap(s=>s.n.map(n=>({id:slug(n),name:n,group:g.g+' › '+s.g})))
]);
const PARENTS = AREAS.flatMap(g=>g.n.filter(x=>typeof x!=='string'));
const isPlant = x => x.group.startsWith(COPY_GROUP);
const userOpts = () => USERS.map(u=>`<option>${esc(u)}</option>`).join('');
const linkFor = id => location.origin+location.pathname+'#/area/'+id;
let notes = [], pending = [], cur = null;

function pass(){ return localStorage.getItem('en_pass')||''; }
function banner(msg,err){ const b=$('#banner'); if(!msg){b.hidden=true;return;} b.hidden=false; b.className=err?'err':''; b.textContent=msg; }

/* ---------- data layer ---------- */
async function load(){
  if(!API_URL) return JSON.parse(localStorage.getItem('en_notes')||'[]');
  const r = await fetch(API_URL+'?pass='+encodeURIComponent(pass()));
  const j = await r.json();
  if(j.error){
    if(/passcode/i.test(j.error)){ const p=prompt('Enter the team passcode:'); if(p){localStorage.setItem('en_pass',p); return load();} }
    throw new Error(j.error);
  }
  return j.notes;
}
async function api(body){
  if(!API_URL){
    let l=JSON.parse(localStorage.getItem('en_notes')||'[]');
    if(body.action==='add'){
      [body.area].concat(body.copyAreas||[]).forEach((ar,i)=>{
        l.push({id:crypto.randomUUID(),ts:Date.now(),area:ar,engineer:body.engineer,status:body.status,trade:body.trade,sentTo:body.sendTo||'',note:(i?(body.copyPrefix||''):'')+(body.note||''),images:body.images});
      });
    }
    if(body.action==='status') l.forEach(n=>{if(n.id===body.id)n.status=body.status});
    if(body.action==='delete') l=l.filter(n=>n.id!==body.id);
    localStorage.setItem('en_notes',JSON.stringify(l)); return {ok:true};
  }
  const r = await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({...body,pass:pass()})});
  const j = await r.json(); if(j.error) throw new Error(j.error); return j;
}
async function refresh(){
  try{ notes = await load(); banner(API_URL?'':'Local mode: notes are only saved on THIS device. Set up the shared backend so everyone can see them.'); }
  catch(e){ banner('Could not load notes: '+e.message,true); }
  route(true);
}

/* ---------- views ---------- */
function route(keepForm){
  const m = location.hash.match(/^#\/area\/(.+)$/);
  if(m){ const a=ALL.find(x=>x.id===m[1]); if(a) return areaView(a,keepForm); }
  const g = location.hash.match(/^#\/group\/(.+)$/);
  if(g){ const p=PARENTS.find(x=>slug(x.name)===g[1]); if(p) return groupView(p); }
  homeView();
}
function tile(x){
  const kids = typeof x==='string' ? null : x.kids;
  const name = kids ? x.name : x;
  const ids = kids ? kids.map(slug) : [slug(name)];
  const l = notes.filter(n=>ids.includes(n.area));
  const o = l.filter(n=>n.status==='Open').length, p = l.filter(n=>n.status==='In progress').length;
  const link = kids ? '#/group/'+slug(name) : '#/area/'+slug(name);
  return `<button class="area ${kids?'folder':''} ${o?'hasopen':''}" onclick="location.hash='${link}'"><b>${esc(name)}</b>
    ${o?`<span class="pill open">${o} open</span>`:''}${p?`<span class="pill prog">${p} in progress</span>`:''}
    ${kids?`<span class="pill">${kids.length} areas ›</span>`:`<span class="pill">${l.length} note${l.length==1?'':'s'}</span>`}</button>`;
}
function grid(list){ return `<div class="grid">${list.map(tile).join('')}</div>`; }
function homeView(){
  let h='';
  AREAS.forEach(g=>{
    h+=`<h2>${esc(g.g)}</h2>`;
    if(g.n.length) h+=grid(g.n);
    (g.sub||[]).forEach(s=>{ h+=`<h3 class="sub">${esc(s.g)}</h3>`+grid(s.n); });
  });
  $('#app').innerHTML=h;
}
function groupView(p){
  $('#app').innerHTML=`<button class="btn alt" onclick="location.hash=''">← All areas</button>
    <h2 style="font-size:20px;text-transform:none;color:#1b2330;letter-spacing:0">${esc(p.name)}</h2>`+grid(p.kids);
}
function locHTML(){
  const by={};
  ALL.filter(x=>!isPlant(x)).forEach(x=>{ (by[x.group]=by[x.group]||[]).push(x); });
  return Object.keys(by).map(g=>`<optgroup label="${esc(g)}">${by[g].map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</optgroup>`).join('');
}
function areaView(a,keepForm){
  cur=a;
  if(!keepForm || !$('#form')){
    pending=[];
    const plant=isPlant(a), par=a.parent;
    $('#app').innerHTML=`
    ${par?`<button class="btn alt" onclick="location.hash='#/group/${slug(par.name)}'">← ${esc(par.name)}</button>`
         :`<button class="btn alt" onclick="location.hash=''">← All areas</button>`}
    <h2 style="font-size:20px;text-transform:none;color:#1b2330;letter-spacing:0">${esc(a.name)} <small style="color:#667;font-weight:400">· ${esc(a.group)}</small></h2>
    <div class="card" id="form">
      ${plant?`<div class="locbox"><label>Location this report is for</label>
        <select id="loc"><option value="">Select location…</option><option value="none">No location (${esc(a.name)} only)</option>${locHTML()}</select>
        <div class="hint">The note is saved here and also on the location you choose.</div></div>`:''}
      <div class="row">
        <div><label>Your name</label><select id="who"><option value="">Select your name…</option>${userOpts()}</select></div>
        <div><label>Trade</label><select id="trade"><option value="">Select…</option>${TRADES.map(t=>`<option>${t}</option>`).join('')}</select></div>
        <div><label>Status</label><select id="stat">${STATUSES.map(s=>`<option>${s}</option>`).join('')}</select></div>
        ${par&&par.bld?`<div><label>Building</label><select id="bld"><option value="">Not specified</option><option>Building 1</option><option>Building 2</option><option>Both buildings</option></select></div>`:''}
      </div>
      <label>Notes</label><textarea id="txt" placeholder="What's the issue / what has been done / what's needed?"></textarea>
      <label>Photos</label>
      <input type="file" id="pics" accept="image/*" multiple>
      <div class="thumbs" id="prev"></div>
      <label>Send this note to (optional)</label>
      <select id="sendto"><option value="">Don't send</option>${userOpts()}</select>
      <div class="hint">They get an email at their CBRE address with the note, photo links and a link to this area.</div>
      <p style="font-size:13px;color:#667;margin:10px 0 0">Date and time are added automatically when you save.</p>
      <button class="btn" id="save" style="margin-top:10px">Save note</button>
    </div>
    <h2>Previous notes</h2><div id="list"></div>`;
    const sv=localStorage.getItem('en_name')||'';
    if(USERS.includes(sv)) $('#who').value=sv;
    $('#pics').onchange=async e=>{
      for(const f of e.target.files){ if(pending.length<6) pending.push(await shrink(f)); }
      e.target.value=''; drawPrev();
    };
    $('#save').onclick=()=>save(a);
  }
  drawList(a);
}
function drawPrev(){
  $('#prev').innerHTML=pending.map((u,i)=>`<div class="x"><img src="${u}" onclick="zoom(this.src)"><button onclick="pending.splice(${i},1);drawPrev()">×</button></div>`).join('');
}
function drawList(a){
  const l=notes.filter(n=>n.area===a.id).sort((x,y)=>y.ts-x.ts);
  $('#list').innerHTML = l.length ? l.map(n=>`
    <div class="card note">
      <div class="meta"><span><b>${esc(n.engineer||'Unknown')}</b> · ${fmt(n.ts)}</span>
        <span>${n.trade?`<span class="pill ${n.trade==='HVAC'?'hv':'el'}">${esc(n.trade)}</span>`:''}<span class="pill ${n.status==='Open'?'open':n.status==='In progress'?'prog':''}">${esc(n.status)}</span></span></div>
      <div class="txt">${esc(n.note)}</div>
      ${(n.images&&n.images.length)?`<div class="thumbs">${n.images.map(u=>`<img src="${esc(u)}" onclick="zoom(this.src)" loading="lazy">`).join('')}</div>`:''}
      ${n.sentTo?`<div class="sent">✉ Sent to ${esc(n.sentTo)}</div>`:''}
      <div class="acts">
        <select onchange="setStatus('${n.id}',this.value)">${STATUSES.map(s=>`<option ${s===n.status?'selected':''}>${s}</option>`).join('')}</select>
        <select onchange="emailNote('${n.id}',this)"><option value="">✉ Email to…</option>${userOpts()}</select>
        <button class="del" onclick="del('${n.id}')">Delete</button>
      </div>
    </div>`).join('') : '<div class="empty">No notes for this area yet.</div>';
}

/* ---------- actions ---------- */
function shrink(file){
  return new Promise((res,rej)=>{
    const img=new Image(), u=URL.createObjectURL(file);
    img.onload=()=>{
      const sc=Math.min(1,1000/Math.max(img.width,img.height)), c=document.createElement('canvas');
      c.width=img.width*sc; c.height=img.height*sc;
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(u); res(c.toDataURL('image/jpeg',.72));
    };
    img.onerror=rej; img.src=u;
  });
}
async function save(a){
  const who=$('#who').value, trade=$('#trade').value, sendTo=$('#sendto').value;
  let txt=$('#txt').value.trim();
  const loc=$('#loc');
  if(loc && !loc.value) return alert('Please choose a location from the list first.');
  if(!who) return alert('Please choose your name.');
  if(!trade) return alert('Please choose Electrical or HVAC.');
  if(!txt && !pending.length) return alert('Add a note or a photo first.');
  if(sendTo && !API_URL) return alert('Emailing only works once the app is connected to the shared backend.');
  const bs=$('#bld');
  if(bs && bs.value) txt='['+bs.value+'] '+txt;
  localStorage.setItem('en_name',who);
  const copies = (loc && loc.value!=='none') ? [loc.value] : [];
  const locObj = copies.length ? ALL.find(x=>x.id===copies[0]) : null;
  const b=$('#save'); b.disabled=true; b.textContent='Saving…';
  try{
    const res = await api({action:'add',area:a.id,engineer:who,trade:trade,status:$('#stat').value,note:txt,images:pending,
      copyAreas:copies,copyPrefix:'[From '+a.name+']\n',sendTo:sendTo,
      areaName: locObj ? locObj.name+' (from '+a.name+')' : a.name,
      link: linkFor(locObj ? locObj.id : a.id)});
    pending=[]; $('#txt').value=''; drawPrev();
    if(bs) bs.value='';
    if(loc) loc.value='';
    $('#trade').value=''; $('#sendto').value='';
    notes=await load(); drawList(a);
    if(sendTo){
      if(res && res.mailErr) alert('Note saved, but the email could not be sent: '+res.mailErr);
      else alert('Saved and emailed to '+sendTo+'.');
    }
  }catch(e){ alert('Save failed: '+e.message); }
  b.disabled=false; b.textContent='Save note';
}
async function emailNote(id,sel){
  const to=sel.value; if(!to) return;
  sel.value='';
  if(!API_URL) return alert('Emailing only works once the app is connected to the shared backend.');
  if(!confirm('Email this note to '+to+'?')) return;
  try{
    await api({action:'email',id:id,sendTo:to,areaName:cur.name,link:linkFor(cur.id)});
    notes=await load(); route(true);
    alert('Emailed to '+to+'.');
  }catch(e){ alert('Email failed: '+e.message); }
}
async function setStatus(id,s){
  try{ await api({action:'status',id,status:s}); notes=await load(); route(true); }catch(e){alert(e.message);}
}
async function del(id){
  if(!confirm('Delete this note for everyone?')) return;
  try{ await api({action:'delete',id}); notes=await load(); route(true); }catch(e){alert(e.message);}
}
function zoom(src){ $('#lbimg').src=src; $('#lb').style.display='flex'; }

$('#refresh').onclick=refresh;
window.addEventListener('hashchange',()=>route(false));
setInterval(()=>{ if(document.visibilityState==='visible' && !document.activeElement.matches('textarea,input,select')) refresh(); },60000);
refresh();
</script>
</body>
</html>
